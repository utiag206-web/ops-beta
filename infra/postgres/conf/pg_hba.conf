# ==============================================================================
# POLÍTICA DE CONTROL DE ACCESO (pg_hba.conf) - INTHALY
# ==============================================================================
# Tipo   Base de Datos       Usuario                     Dirección        Método
# ==============================================================================

# Conexiones locales del host (socket UNIX)
local   all                 all                                          trust

# Conexiones IPv4 locales
host    all                 all                 127.0.0.1/32             scram-sha-256

# Conexiones desde la red interna de Docker (puente privado)
host    all                 all                 172.16.0.0/12            scram-sha-256
host    all                 all                 10.0.0.0/8               scram-sha-256

# Conexiones IPv6 locales
host    all                 all                 ::1/128                  scram-sha-256

# REGLA DE SEGURIDAD ESTRICTA:
# Cualquier intento de conexión directa desde IPs públicas no autorizadas se rechaza.
# El puerto 5432 solo se vincula a 127.0.0.1 en el docker-compose.
