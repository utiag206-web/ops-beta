# ==============================================================================
# CONFIGURACIÓN DE POSTGRESQL 16: INTHALY AUTOGESTIONADO
# ==============================================================================
# Optimizado para servidores VPS Linux con 2GB - 4GB RAM y almacenamiento NVMe.
# ==============================================================================

# CONECTIVIDAD Y RED
listen_addresses = '*'
port = 5432
max_connections = 100
password_encryption = scram-sha-256

# MEMORIA Y RECURSOS
shared_buffers = 512MB
effective_cache_size = 1536MB
maintenance_work_mem = 128MB
work_mem = 16MB
min_wal_size = 1GB
max_wal_size = 4GB

# CHECKPOINTS Y ESCRITURA
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
wal_buffers = 16MB
default_statistics_target = 100

# PLANIFICADOR
random_page_cost = 1.1 # Optimizado para unidades SSD / NVMe
effective_io_concurrency = 200

# LOGS Y AUDITORÍA
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 250 # Registra queries lentas (> 250ms)
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

# INTERNACIONALIZACIÓN Y FECHAS
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.spanish'
